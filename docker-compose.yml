services:
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - tp-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list"]
      interval: 5s
      timeout: 10s
      retries: 10

  init-kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "bash", "-c" ]
    command: |
      "
      # Création des topics avec 6 partitions pour permettre le scaling à K instances
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic commandes-creees --partitions 3 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic demandes-predictions --partitions 6 --replication-factor 1
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic resultats-predictions --partitions 6 --replication-factor 1
      echo '=== Topics Kafka initialisés avec succès ==='
      "
    networks:
      - tp-network

  clients:
    build:
      context: ./clients
      dockerfile: Dockerfile
    container_name: microservice-clients
    ports:
      - "8080:8080"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_GROUP_ID=clients-group
      - KAFKA_TOPIC=commandes-creees
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tp-network

  commandes:
    build:
      context: ./commandes
      dockerfile: Dockerfile
    container_name: microservice-commandes
    ports:
      - "8081:8080"
    environment:
      - CLIENTS_SERVICE_URL=http://clients:8080
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_TOPIC=commandes-creees
      - KAFKA_TOPIC_PREDICTIONS_REQUEST=demandes-predictions
      - KAFKA_TOPIC_PREDICTIONS_RESULT=resultats-predictions
      - KAFKA_GROUP_ID_PREDICTIONS=commandes-predictions-group
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tp-network

  statistiques:
    build:
      context: ./statistiques
      dockerfile: Dockerfile
    container_name: microservice-statistiques
    ports:
      - "8082:8080"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_GROUP_ID=statistiques-group
      - KAFKA_TOPIC=commandes-creees
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tp-network

  prediction:
    build:
      context: ./prediction
      dockerfile: Dockerfile
    # Pas de container_name fixe pour permettre le scaling :
    # docker compose up --scale prediction=K -d
    ports:
      - "8083-8090:8080"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - KAFKA_GROUP_ID=prediction-group
      - KAFKA_TOPIC_REQUEST=demandes-predictions
      - KAFKA_TOPIC_RESULT=resultats-predictions
      - MODEL_PATH=modele_commande.pkl
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - tp-network

networks:
  tp-network:
    driver: bridge
